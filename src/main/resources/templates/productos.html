<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Productos</title>
</head>

<body class="bg-light">
	<div class="container py-4"><a th:href="@{/menu}">← Menú</a>
		<h2>Productos</h2>
		<form class="row g-2 mb-3" method="get">
			<div class="col"><input class="form-control" name="q" th:value="${q}" placeholder="Buscar producto"></div>
			<div class="col-auto"><button class="btn btn-secondary">Buscar</button><a class="btn btn-outline-danger"
					target="_blank" th:href="@{/reportes/productos.pdf}">PDF</a></div>
		</form>
		<div class="row">
			<div class="col-md-4">
				<form th:action="@{/productos/guardar}" method="post" th:object="${producto}" class="card card-body">
					<h5>Datos del producto</h5><input type="hidden"
						th:field="*{codigoProducto}"><label>Nombre</label><input class="form-control mb-2"
						th:field="*{nombre}" required><label>Precio</label><input type="number" step="0.01"
						class="form-control mb-2" th:field="*{precio}" required><label>Stock actual</label><input
						type="number" class="form-control mb-2" th:field="*{stockActual}" required><label>Stock
						mínimo</label><input type="number" class="form-control mb-2" th:field="*{stockMinimo}"
						required><label>Stock máximo</label><input type="number" class="form-control mb-2"
						th:field="*{stockMaximo}" required><label>Categoría</label><select name="categoriaId"
						class="form-select mb-3">
						<option value="">Sin categoría</option>
						<option th:each="cat:${categorias}" th:value="${cat.idcatpr}"
							th:selected="${producto.categoria != null and producto.categoria.idcatpr == cat.idcatpr}"
							th:text="${cat.nombre}"></option>
					</select><button class="btn btn-primary">Guardar</button><a class="btn btn-link"
						th:href="@{/productos}">Nuevo producto</a>
				</form>
			</div>
			<div class="col-md-8">
				<table class="table table-striped bg-white">
					<thead>
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Categoría</th>
							<th>Precio</th>
							<th>Stock</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p:${listaProductos}">
							<td th:text="${p.codigoProducto}"></td>
							<td th:text="${p.nombre}"></td>
							<td th:text="${p.categoria != null ? p.categoria.nombre : '—'}"></td>
							<td th:text="${p.precio}"></td>
							<td th:text="${p.stockActual}"></td>
							<td><a class="btn btn-sm btn-warning"
									th:href="@{/productos(editar=${p.codigoProducto})}">Editar</a>
								<form class="d-inline" th:action="@{/productos/eliminar/{id}(id=${p.codigoProducto})}"
									method="post" onsubmit="return confirm('¿Eliminar producto?')"><button
										class="btn btn-sm btn-danger">Eliminar</button></form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>

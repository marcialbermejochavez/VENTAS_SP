<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Categorías de productos</title>
</head>

<body class="bg-light">
	<div class="container py-4"><a th:href="@{/menu}">← Menú</a>
		<h2>Categorías de productos</h2>
		<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		<div class="row">
			<div class="col-md-4">
				<form th:action="@{/categorias/productos/guardar}" method="post" class="card card-body"><input
						type="hidden" name="idcatpr" th:value="${categoria.idcatpr}"><label>Nombre</label><input
						name="nombre" maxlength="50" class="form-control mb-3" th:value="${categoria.nombre}"
						required><button class="btn btn-primary">Guardar</button><a th:href="@{/categorias/productos}"
						class="btn btn-link">Nueva categoría</a></form>
			</div>
			<div class="col-md-8">
				<table class="table bg-white">
					<thead>
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c:${lista}">
							<td th:text="${c.idcatpr}"></td>
							<td th:text="${c.nombre}"></td>
							<td><a class="btn btn-sm btn-outline-primary"
									th:href="@{/categorias/productos(editar=${c.idcatpr})}">Editar</a>
								<form class="d-inline" method="post"
									th:action="@{/categorias/productos/eliminar/{id}(id=${c.idcatpr})}"
									onsubmit="return confirm('¿Eliminar categoría?')"><button
										class="btn btn-sm btn-danger">Eliminar</button></form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>

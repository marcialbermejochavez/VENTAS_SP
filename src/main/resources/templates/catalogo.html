<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<title>Catálogo</title>
</head>

<body>
	<div class="container py-4">
		<a th:href="@{/menu}">← Menú</a>
		<h2>Catálogo de productos</h2>

		<div class="row g-3">
			<div class="col-md-3" th:each="p : ${listaProductos}">
				<div class="card h-100">
					<img th:src="@{/images/{id}.jpg(id=${p.codigoProducto})}" class="card-img-top" th:alt="${p.nombre}"
						onerror="this.style.display='none'" />
					<div class="card-body">
						<h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
						<p class="card-text">S/ <span th:text="${p.precio}">0.00</span></p>
						<p class="card-text">Stock: <span th:text="${p.stockActual}">0</span></p>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>

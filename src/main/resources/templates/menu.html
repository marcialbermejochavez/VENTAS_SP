<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Menú</title>
</head>

<body>
	<div class="container py-5">
		<div class="d-flex justify-content-between">
			<h1>Proyecto TURA</h1>
			<form th:action="@{/logout}" method="post"><button class="btn btn-outline-danger">Cerrar sesión</button>
			</form>
		</div>
		<p>Bienvenido, <strong sec:authentication="name"></strong></p>
		<div class="row g-3">
			<div class="col-md-3"><a class="btn btn-primary w-100 p-4" th:href="@{/clientes}">Clientes</a></div>
			<div class="col-md-3"><a class="btn btn-primary w-100 p-4" th:href="@{/productos}">Productos</a></div>
			<div class="col-md-3"><a class="btn btn-primary w-100 p-4" th:href="@{/ventas}">Ventas</a></div>
			<div class="col-md-3" sec:authorize="hasRole('ADMIN')"><a class="btn btn-primary w-100 p-4"
					th:href="@{/usuarios}">Usuarios</a></div>
			<div class="col-md-3"><a class="btn btn-outline-primary w-100 p-4" th:href="@{/catalogo}">Catálogo</a></div>
			<div class="col-md-3"><a class="btn btn-outline-primary w-100 p-4"
					th:href="@{/categorias/productos}">Categorías productos</a></div>
			<div class="col-md-3"><a class="btn btn-outline-primary w-100 p-4"
					th:href="@{/categorias/clientes}">Categorías clientes</a></div>
			<div class="col-md-3"><a class="btn btn-outline-primary w-100 p-4" th:href="@{/dashboard}">Indicadores</a>
			</div>
		</div>
	</div>
</body>

</html>

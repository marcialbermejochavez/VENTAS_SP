<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Usuarios</title>
</head>

<body class="bg-light">
	<div class="container py-4"><a th:href="@{/menu}">← Menú</a>
		<h2>Usuarios</h2>
		<div class="row">
			<div class="col-md-4">
				<form th:action="@{/usuarios/guardar}" method="post" th:object="${usuarioForm}" class="card card-body">
					<input type="hidden" th:field="*{codigoUsuario}"><input class="form-control mb-2"
						th:field="*{nombres}" placeholder="Nombres" required><input class="form-control mb-2"
						th:field="*{apellidos}" placeholder="Apellidos" required><input class="form-control mb-2"
						type="email" th:field="*{email}" placeholder="Email" required><input class="form-control mb-2"
						th:field="*{telefono}" placeholder="Teléfono" required><input class="form-control mb-2"
						th:field="*{usuario}" placeholder="Usuario" required><input class="form-control mb-2"
						name="nuevaPass" type="password" placeholder="Contraseña (vacío conserva actual)"><select
						class="form-select mb-2" th:field="*{rol}">
						<option value="ADMIN">ADMIN</option>
						<option value="OPERADOR">OPERADOR</option>
					</select><button class="btn btn-primary">Guardar</button></form>
			</div>
			<div class="col-md-8">
				<table class="table table-striped bg-white">
					<thead>
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Usuario</th>
							<th>Rol</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="u:${listaUsuarios}">
							<td th:text="${u.codigoUsuario}"></td>
							<td th:text="${u.nombres+' '+u.apellidos}"></td>
							<td th:text="${u.usuario}"></td>
							<td th:text="${u.rol}"></td>
							<td><a class="btn btn-sm btn-warning"
									th:href="@{/usuarios(editar=${u.codigoUsuario})}">Editar</a>
								<form class="d-inline"
									th:action="@{/usuarios/eliminar/<built-in function id>(id=${u.codigoUsuario})}"
									method="post"><button class="btn btn-sm btn-danger">Eliminar</button></form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Ingreso - TURA</title>
</head>

<body class="bg-light">
	<div class="container" style="max-width:430px;margin-top:10vh">
		<div class="card shadow">
			<div class="card-body p-4">
				<h2 class="text-center">Sistema de Ventas TURA</h2>
				<div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</div>
				<div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
				<form th:action="@{/login}" method="post"><label class="form-label">Usuario</label><input name="usuario"
						class="form-control mb-3" required autofocus><label class="form-label">Contraseña</label><input
						name="contrasena" type="password" class="form-control mb-3" required><button
						class="btn btn-primary w-100">Ingresar</button></form><small
					class="text-muted d-block mt-3">Usuario inicial: tito / 123456</small>
			</div>
		</div>
	</div>
</body>

</html>

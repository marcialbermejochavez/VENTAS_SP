<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Ventas</title>
</head>

<body class="bg-light">
	<div class="container-fluid py-4"><a th:href="@{/menu}">← Menú</a>
		<h2>Ventas: cabecera y detalle</h2>
		<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		<div class="row g-3">
			<div class="col-lg-4">
				<form th:action="@{/ventas/registrar}" method="post" class="card card-body">
					<h5>Cabecera de venta</h5><label>Número de venta</label><input name="numero" maxlength="50"
						class="form-control mb-2" required><label>Cliente</label><select class="form-select mb-2"
						name="codigoCliente" id="cliente" required>
						<option value="">Seleccione...</option>
						<option th:each="c:${clientes}" th:value="${c.codigoCliente}" th:text="${c.nombreCompleto}"
							th:attr="data-ruc=${c.ruc}"></option>
					</select><label>RUC</label><input name="ruc" id="ruc" maxlength="20"
						class="form-control mb-2"><label>Moneda</label><select name="moneda" class="form-select mb-2">
						<option value="1">Soles (PEN)</option>
						<option value="2">Dólares (USD)</option>
					</select><label>Fecha</label><input type="date" name="fecha" th:value="${fechaHoy}"
						class="form-control mb-3" required>
					<hr>
					<div class="d-flex justify-content-between align-items-center">
						<h5>Detalle</h5><button type="button" class="btn btn-sm btn-outline-primary"
							onclick="agregarLinea()">+ Producto</button>
					</div>
					<div id="detalles">
						<div class="linea border rounded p-2 mb-2"><label>Producto</label><select name="productoId"
								class="form-select mb-2" required>
								<option value="">Seleccione...</option>
								<option th:each="p:${productos}" th:value="${p.codigoProducto}"
									th:text="${p.nombre+' - S/ '+p.precio+' (stock '+p.stockActual+')'}"></option>
							</select><label>Cantidad</label>
							<div class="input-group"><input type="number" min="1" name="cantidadDetalle"
									class="form-control" value="1" required><button type="button"
									class="btn btn-outline-danger" onclick="quitarLinea(this)">Quitar</button></div>
						</div>
					</div><button class="btn btn-primary mt-2">Registrar venta</button>
					<p class="text-muted small mt-2 mb-0">El sistema descuenta stock y calcula subtotal afecto, IGV (18
						%) y total. Los precios se toman del catálogo.</p>
				</form>
				<hr>
				<form th:action="@{/reportes/ventas.pdf}" target="_blank"><label>Reporte de ventas por
						fecha</label><input type="date" name="desde" class="form-control mb-2" required><input
						type="date" name="hasta" class="form-control mb-2" required><button
						class="btn btn-outline-danger w-100">Generar PDF</button></form><a
					class="btn btn-outline-danger w-100 mt-2" target="_blank" th:href="@{/reportes/resumen.pdf}">Resumen
					PDF</a>
			</div>
			<div class="col-lg-8">
				<div class="table-responsive">
					<table class="table table-striped table-sm bg-white align-middle">
						<thead>
							<tr>
								<th>ID</th>
								<th>Número</th>
								<th>Cliente</th>
								<th>RUC</th>
								<th>Fecha</th>
								<th>Moneda</th>
								<th>Subtotal</th>
								<th>IGV</th>
								<th>Total</th>
								<th>Detalle</th>
								<th></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="v:${listaVentas}">
								<td th:text="${v.idventac}"></td>
								<td th:text="${v.numero}"></td>
								<td th:text="${v.cliente.nombreCompleto}"></td>
								<td th:text="${v.ruc}"></td>
								<td th:text="${#lists.isEmpty(v.detalles) ? '—' : v.detalles[0].fecha}"></td>
								<td th:text="${v.moneda == 1 ? 'PEN' : 'USD'}"></td>
								<td th:text="${v.subtotalAfecto}"></td>
								<td th:text="${v.igv}"></td>
								<td th:text="${v.total}"></td>
								<td>
									<details>
										<summary th:text="${#lists.size(v.detalles)+' producto(s)'}"></summary>
										<table class="table table-sm">
											<tr th:each="d:${v.detalles}">
												<td th:text="${d.producto.nombre}"></td>
												<td th:text="${d.cantidad}"></td>
												<td th:text="${d.precio}"></td>
												<td th:text="${d.total}"></td>
											</tr>
										</table>
									</details>
								</td>
								<td>
									<form th:action="@{/ventas/eliminar/{id}(id=${v.idventac})}" method="post"
										onsubmit="return confirm('¿Eliminar venta y devolver el stock de todos sus detalles?')">
										<button class="btn btn-sm btn-danger">Eliminar</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<script>function agregarLinea() {const c = document.getElementById('detalles'); const o = c.querySelector('.linea'); const n = o.cloneNode(true); n.querySelector('select').selectedIndex = 0; n.querySelector('input').value = 1; c.appendChild(n)} function quitarLinea(b) {const c = document.getElementById('detalles'); if (c.querySelectorAll('.linea').length > 1) b.closest('.linea').remove()} document.getElementById('cliente').addEventListener('change', function () {const o = this.options[this.selectedIndex]; document.getElementById('ruc').value = o.dataset.ruc || ''});</script>
</body>

</html>
